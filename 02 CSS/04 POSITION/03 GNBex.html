    <style>
        /* common */
        * {
            box-sizing: border-box;
        }

        ul {
            padding: 0;
            margin: 3px;
            list-style: none;
        }

        a {
            text-decoration: none;
            color: black;
        }

        body {
            margin: 0;
            padding: 0;
        }

        /* header */
        .wrapper>header>nav {
            height: 50px;
        }

        /* nav's menu */
        .wrapper>header>nav>ul.main-menu {
            justify-content: space-between;
            display: flex;
            height: 100%;
        }

        .wrapper>header>nav>ul.main-menu>li {
            height: 100%;
            padding: 0 1px;
            background-color: antiquewhite;
            position: relative;
        }
        .wrapper>header>nav>ul.main-menu>li {
            display: block;
            height: 100%;
            line-height: 50px;
        }
        .wrapper>header>nav>ul.main-menu>li>ul.sub-menu {
            position: relative;
            left: 0;
            top: 50px;

            display: none;
        }
        .wrapper>header>nav>ul.main-menu>li>ul.sub-menu>li {
            background-color: beige;
            height: 50px;
            line-height: 50px;
            padding: 0 20px;
        }
        .wrapper>header>nav>ul.main-menu>li>ul.sub-menu>li>a {
            display: block;
        }
        .wrapper>header>nav>ul.main-menu>li>a {
            padding: 10px;
        }
        .wrapper>header>nav>ul.main-menu>li:hover>.sub-menu{
            display:block;
        }

    </style>

</head>
